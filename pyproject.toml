[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "f5-guardrail-evaluator"
version = "0.1.0"
description = "Input, response and defence-in-depth evaluation for F5 AI Guardrails"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "pandas>=2.2,<4", "plotly>=6,<7", "gradio>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9", "playwright>=1.50"]

[project.scripts]
guardrail-evaluator = "guardrail_evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardrail_evaluator = ["data/*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: opt-in live tenant test"]

[tool.ruff]
line-length = 110
